version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conduit_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    restart: unless-stopped
    # Depending on local db for local development (Neon is for cloud)
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: conduit_db
    environment:
      POSTGRES_USER: conduit_user
      POSTGRES_PASSWORD: conduit_password
      POSTGRES_DB: conduit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: conduit_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
